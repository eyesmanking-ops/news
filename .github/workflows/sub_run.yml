name: 深度新聞巡邏

on:
  schedule:
    - cron: '10,30,50 * * * *'
  workflow_dispatch: # 讓你可以手動按按鈕測試

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests feedparser

      - name: Run Sub Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sub_news.py

      - name: Commit Change
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git pull
          git add sent_links.txt || exit 0
          git commit -m "Update sub news history [skip ci]" || exit 0
          git push
