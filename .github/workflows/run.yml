name: News Patrol Bot

on:
  schedule:
    # 每 30 分鐘執行一次 (UTC 時間)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允許手動點擊執行

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Requirements
        run: pip install requests feedparser

      - name: Execute Script
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py
